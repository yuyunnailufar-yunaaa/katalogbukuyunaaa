<!-- Header Warna Pink Fuschia -->
  <header class="relative overflow-hidden bg-[#D81B60] dark:bg-slate-950 border-b border-pink-700/40 py-12 px-4 sm:px-6 lg:px-8 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
      <div class="text-center md:text-left">
        
        <!-- Welcome Badge & Logo Utama (Sejajar) -->
        <div class="flex flex-wrap items-center justify-center md:justify-start gap-4 mb-4">
          
          <!-- Badge Welcome -->
          <div class="inline-flex items-center px-4 py-2 rounded-full bg-white/20 text-white text-xs font-bold tracking-wider backdrop-blur-md border border-white/20 shadow-sm">
            <span>Welcome to Yunaaa's Library</span>
          </div>

          <!-- Logo Berdiri Sendiri di Samping Badge (Jelas, Terbaca, & Kontras Tinggi) -->
          <div class="flex items-center gap-2 bg-white/10 hover:bg-white/20 transition-all px-3.5 py-1.5 rounded-2xl border border-white/25 backdrop-blur-md shadow-sm">
            <svg class="h-8 w-auto fill-current text-white shrink-0 drop-shadow-sm" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
              <!-- Simbol Buku -->
              <path d="M 50 310 C 120 200, 220 180, 320 280 M 60 330 C 140 230, 230 210, 310 300 M 80 350 C 160 260, 240 240, 300 320 M 110 370 C 180 290, 250 280, 290 340 M 150 385 C 200 330, 260 320, 285 360 M 50 385 Q 200 395 310 370 C 400 370, 500 390, 560 380 Q 420 400, 50 385 Z M 210 385 A 20 20 0 0 1 250 385" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <!-- Teks Logo -->
              <text x="350" y="240" font-family="'Gloria Hallelujah', cursive" font-size="120" font-weight="bold" fill="#FFFFFF">Perpustakaan</text>
              <text x="510" y="360" font-family="'Gloria Hallelujah', cursive" font-size="120" font-weight="bold" fill="#FFFFFF">yunaaa</text>
              <circle cx="400" cy="315" r="28" fill="#FFFFFF"/>
              <circle cx="910" cy="305" r="18" fill="#FFFFFF"/>
            </svg>
            <span class="text-white font-bold text-xs tracking-wide">Perpustakaan Yunaaa</span>
          </div>

        </div>

        <!-- Header Title -->
        <h1 class="text-3xl sm:text-5xl font-bold text-white font-header tracking-wide leading-relaxed sm:leading-loose mb-3">
          Katalog Buku Yunaaa
        </h1>
        <p class="mt-2 text-sm sm:text-base text-pink-50 max-w-xl font-medium leading-relaxed">
          Temukan koleksi bacaan, rekomendasi favorit, dan cek ketersediaan buku yang bisa kamu pinjam.
        </p>
      </div>

      <!-- Quick Stats & Theme Toggle -->
      <div class="flex items-center gap-4">
        <div class="flex gap-3 text-center">
          <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl border border-white/20 min-w-[80px]">
            <span id="statTotal" class="block text-2xl font-extrabold text-white">0</span>
            <span class="text-[10px] uppercase font-bold text-pink-100 tracking-wider">Total Buku</span>
          </div>
          <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl border border-white/20 min-w-[80px]">
            <span id="statAvailable" class="block text-2xl font-extrabold text-emerald-300">0</span>
            <span class="text-[10px] uppercase font-bold text-pink-100 tracking-wider">Tersedia</span>
          </div>
        </div>

        <button id="themeToggle" class="p-3.5 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 text-white hover:bg-white/20 transition-all">
          🌙
        </button>
      </div>
    </div>
  </header>
